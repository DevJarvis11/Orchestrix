[project]
name = "orchestrix-mcp-web"
version = "0.1.0"
description = "MCP server: web.search and web.fetch"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "orchestrix-tools",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-tools = { workspace = true }
