[project]
name = "orchestrix-mcp-sandbox"
version = "0.1.0"
description = "MCP server: sandboxed run_python"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "orchestrix-tools",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-tools = { workspace = true }
