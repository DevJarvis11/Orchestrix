[project]
name = "orchestrix-mcp-files"
version = "0.1.0"
description = "MCP server: S3-backed artifacts"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "orchestrix-core",
    "orchestrix-tools",
    "pypdf>=6.21.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-tools = { workspace = true }
orchestrix-core = { workspace = true }
