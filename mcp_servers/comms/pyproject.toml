[project]
name = "orchestrix-mcp-comms"
version = "0.1.0"
description = "MCP server: simulated send_email"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "orchestrix-core",
    "orchestrix-tools",
    "pydantic[email]>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-tools = { workspace = true }
orchestrix-core = { workspace = true }
