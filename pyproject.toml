[project]
name = "orchestrix"
version = "0.1.0"
description = "Orchestrix multi-agent orchestration platform (workspace root)"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*", "mcp_servers/*"]

[tool.uv.sources]
orchestrix-api = { workspace = true }
orchestrix-worker = { workspace = true }
orchestrix-core = { workspace = true }
orchestrix-agents = { workspace = true }
orchestrix-memory = { workspace = true }
orchestrix-tools = { workspace = true }
orchestrix-policy = { workspace = true }
orchestrix-evals = { workspace = true }
orchestrix-mcp-web = { workspace = true }
orchestrix-mcp-sandbox = { workspace = true }
orchestrix-mcp-data = { workspace = true }
orchestrix-mcp-files = { workspace = true }
orchestrix-mcp-comms = { workspace = true }

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "orchestrix-agents",
    "orchestrix-api",
    "orchestrix-core",
    "orchestrix-evals",
    "orchestrix-mcp-comms",
    "orchestrix-mcp-data",
    "orchestrix-mcp-files",
    "orchestrix-mcp-sandbox",
    "orchestrix-mcp-web",
    "orchestrix-memory",
    "orchestrix-policy",
    "orchestrix-tools",
    "orchestrix-worker",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/web", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PT", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["orchestrix_*"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607"]
"migrations/**" = ["S608"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["apps", "packages", "mcp_servers", "migrations", "scripts", "tests"]
exclude = ["**/node_modules", "apps/web", "**/__pycache__", ".venv"]
typeCheckingMode = "standard"
strict = ["apps/api/src", "packages/*/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: needs Docker (testcontainers)",
    "resilience: needs the Compose stack with fake models (make test-resilience)",
    "stack: needs the running Compose stack (make test-stack)",
]
addopts = "-ra --strict-markers"
