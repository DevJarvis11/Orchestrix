[project]
name = "orchestrix"
version = "0.1.0"
description = "Orchestrix multi-agent orchestration platform (workspace root)"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/*", "mcp_servers/*"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["apps/web", "*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "PT", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["orchestrix_*"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["S608"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["apps", "packages", "mcp_servers", "migrations", "scripts", "tests"]
exclude = ["**/node_modules", "apps/web", "**/__pycache__", ".venv"]
typeCheckingMode = "standard"
strict = ["apps/api/src", "packages/*/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]
addopts = "-ra --strict-markers"
