[project]
name = "orchestrix-api"
version = "0.1.0"
description = "FastAPI service: auth, tasks, runs, escalations, SSE"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "orchestrix-core",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-core = { workspace = true }
