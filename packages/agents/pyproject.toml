[project]
name = "orchestrix-agents"
version = "0.1.0"
description = "LangGraph graph, nodes, specialists, prompts and middleware"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "orchestrix-core",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-core = { workspace = true }
