[project]
name = "orchestrix-tools"
version = "0.1.0"
description = "MCP client registry, allow-lists and tool metadata"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.30.0",
    "orchestrix-core",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-core = { workspace = true }
