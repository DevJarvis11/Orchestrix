# Trigger -> escalation level (SPEC 14.1, FR-41). Configurable without code changes:
# point ORCHESTRIX_ESCALATION_POLICY_PATH at a copy of this file.
levels:
  plan_low_confidence: approve_plan
  plan_approval_required: approve_plan
  plan_invalid_twice: take_over
  ambiguous_request: clarify
  sensitive_tool: approve_action
  policy_require_approval: approve_action
  subtask_failed_twice: take_over
  low_review_score: approve_action
  budget_80: notify
  budget_100: approve_action
  user_requested_review: approve_action
sla_hours: 24
timeout_hours: 72
check_minutes: 15
