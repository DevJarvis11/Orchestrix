[project]
name = "orchestrix-memory"
version = "0.1.0"
description = "Long-term memory: write, retrieve, rerank, consolidate"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "orchestrix-agents",
    "orchestrix-core",
    "pgvector>=0.5.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-core = { workspace = true }
orchestrix-agents = { workspace = true }
