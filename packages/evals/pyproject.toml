[project]
name = "orchestrix-evals"
version = "0.1.0"
description = "Evaluation harness, golden tasks, judges and reports"
authors = [
    { name = "ankith", email = "ankithm111@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "orchestrix-agents",
    "orchestrix-core",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
orchestrix-core = { workspace = true }
orchestrix-agents = { workspace = true }
