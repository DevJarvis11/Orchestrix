# Golden tasks (SPEC 20.2): 40 tasks across five categories. The first 10 are the smoke suite.
# Checks are deterministic (checks.py); the rubric goes to the LLM judge.
version: 1
cases:
- id: g01
  category: research
  title: Licenses of open-source vector databases
  description: Find the license of each of Qdrant, Milvus, Weaviate and pgvector from their official repositories
    or sites. Return a markdown table (database, license, source URL) and one sentence on what the licenses mean
    for commercial use.
  attachments: []
  rubric:
  - Covers all four databases
  - Each license is correct and backed by an official source URL
  - Explains commercial-use implications accurately
  checks:
  - kind: contains_all
    values:
    - qdrant
    - milvus
    - weaviate
    - pgvector
  - kind: contains_any
    values:
    - apache
    - postgresql license
    - bsd
  - kind: min_citations
    n: 4
  - &id001
    kind: citations_resolve
- id: g02
  category: analysis
  title: Qdrant kNN latency
  description: Using the attached query_latency.csv, report the mean p95_ms for database qdrant with query_type
    knn_top10, rounded to one decimal, and say how it compares with pgvector knn_top10 (also one decimal).
  attachments:
  - query_latency.csv
  rubric:
  - Both means are computed correctly
  - States which is faster
  - Shows the method
  checks:
  - kind: csv_number
    csv: query_latency.csv
    column: p95_ms
    agg: mean
    where:
      database: qdrant
      query_type: knn_top10
    decimals:
    - 1
  - kind: csv_number
    csv: query_latency.csv
    column: p95_ms
    agg: mean
    where:
      database: pgvector
      query_type: knn_top10
    decimals:
    - 1
