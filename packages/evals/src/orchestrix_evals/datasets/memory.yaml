# Memory cases (SPEC 20.2): 15 task pairs. Task A teaches a preference or lesson that task B
# needs. Hit = a memory written by A is in B's top 8 and mentions a keyword. Plan quality is a
# position-randomised pairwise judgement of B's plan with vs without memory (fresh team).
version: 1
